<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AnythingLLM 文档上传</title>
<style>
  body{font:14px/1.6 system-ui,Arial,sans-serif;max-width:560px;margin:40px auto;padding:0 16px}
  h1{font-size:18px;margin:0 0 12px}
  .row{margin:8px 0}
  #ws{color:#666}
  button{padding:6px 14px}
  pre{background:#f4f4f4;padding:10px;border-radius:4px;white-space:pre-wrap;word-break:break-all}
  .err{color:#c00}
</style>
</head>
<body>
<h1>AnythingLLM 文档上传</h1>
<div id="ws">正在读取工作区…</div>
<div class="row"><input type="file" id="file"></div>
<div class="row"><button id="up" disabled>上传并嵌入</button> <span id="st"></span></div>
<pre id="out"></pre>
<script>
const BASE="http://127.0.0.1:8010";
let slug=null;
let pendingLocation=null;
const btn=document.getElementById("up"),st=document.getElementById("st"),out=document.getElementById("out");
const retry=document.createElement("button");
retry.id="retry";retry.textContent="重试向量化";retry.hidden=true;
btn.after(retry);

async function request(path,options={}){
  const r=await fetch(path,options);
  const text=await r.text();
  let data=text;
  try{data=JSON.parse(text);}catch(_){}
  if(!r.ok){
    const message=data&&data.error?(typeof data.error==="string"?data.error:data.error.message):text;
    throw new Error("HTTP "+r.status+"："+(message||"请求失败"));
  }
  return data;
}

st.textContent="读取工作区中…";
request(BASE+"/api/workspaces")
 .then(d=>{
   const workspaces=Array.isArray(d.workspaces)?d.workspaces:[];
   if(!workspaces.length)throw new Error("没有可用工作区");
   const w=workspaces[0];
   slug=w.slug;
   document.getElementById("ws").textContent="目标工作区："+w.name+"（slug: "+slug+"）";
   st.textContent="";
   btn.disabled=false;
 }).catch(e=>{
   document.getElementById("ws").textContent="工作区读取失败："+e.message;
   document.getElementById("ws").className="err";
   st.textContent="失败";
 });

async function embedPending(){
  if(!pendingLocation)return;
  st.textContent="向量化中…";btn.disabled=true;retry.disabled=true;
  try{
    const d=await request(BASE+"/api/embed?slug="+encodeURIComponent(slug),{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({adds:[pendingLocation]})
    });
    if(d&&d.success===false)throw new Error(d.message||"AnythingLLM 未确认向量化成功");
    st.textContent="完成：已嵌入";
    out.textContent="文档位置："+pendingLocation+"\n向量化状态：已完成";
    pendingLocation=null;retry.hidden=true;
  }catch(e){
    st.textContent="失败：文档已入库但未向量化";
    out.textContent="文档位置："+pendingLocation+"\n错误："+e.message+"\n请点击“重试向量化”。";
    retry.hidden=false;
  }finally{
    btn.disabled=!slug;retry.disabled=false;
  }
}

btn.onclick=async()=>{
  const f=document.getElementById("file").files[0];
  if(!f){alert("请先选择文件");return;}
  btn.disabled=true;retry.hidden=true;pendingLocation=null;
  st.textContent="上传中…";out.textContent="";
  const fd=new FormData();
  fd.append("file",f);fd.append("addToWorkspaces",slug);
  try{
    const d=await request(BASE+"/api/upload",{method:"POST",body:fd});
    const location=d&&Array.isArray(d.documents)&&d.documents[0]&&d.documents[0].location;
    if(!location)throw new Error("上传响应缺少 documents[0].location");
    pendingLocation=location;
    out.textContent="文档位置："+location;
    await embedPending();
  }catch(e){
    st.textContent="失败：上传未完成";out.textContent="错误："+e.message;
    btn.disabled=false;
  }
};
retry.onclick=embedPending;
</script>
</body>
</html>
